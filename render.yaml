services:
  - type: web
    name: social-media-trend-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r web-app/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --chdir web-app app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: META_GRAPH_API_VERSION
        value: v22.0
      - key: INSTAGRAM_TREND_HASHTAGS
        value: ai,travel,fashion,food,fitness
      - key: AISA_TWITTER_TRENDS_COUNT
        value: "30"
      - key: APIFY_INSTAGRAM_INPUT
        value: '{"hashtags":["ai","travel","fashion","food","fitness"],"resultsLimit":100}'
      - key: X_TREND_QUERY
        value: '(#ai OR #travel OR #fashion OR #food OR #fitness) -is:retweet'